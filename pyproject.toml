[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "doccolab"
version = "0.1.0"
description = "Git-native document automation for Google Docs, Word Online, people, and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "DocColab contributors" }]
dependencies = [
  "anthropic>=0.67,<1",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "markdown-it-py>=4,<5",
  "mcp[cli]>=1.27,<3",
  "msal>=1.33,<2",
  "openai>=1.109,<3",
  "pydantic>=2.11,<3",
  "python-docx>=1.2,<2",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "twine>=6,<8",
]

[project.scripts]
doccolab = "agent.main:cli"
doccolab-mcp = "agent.mcp_server.main:cli"
doccolab-setup = "agent.setup_wizard:cli"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=agent --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in read-only tests against configured cloud provider fixtures",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
