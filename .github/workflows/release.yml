name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Required quality and security gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and verify distributions
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install uv==0.11.7 build twine

      - name: Require the release commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches project version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match project version v{version}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/doccolab-release-smoke
          /tmp/doccolab-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/doccolab-release-smoke/bin/python - <<'PY'
          import importlib
          import pkgutil
          import agent

          for module in pkgutil.walk_packages(agent.__path__, agent.__name__ + "."):
              importlib.import_module(module.name)
          print(agent.__version__)
          PY
          /tmp/doccolab-release-smoke/bin/doccolab --help
          /tmp/doccolab-release-smoke/bin/doccolab-mcp --help
          /tmp/doccolab-release-smoke/bin/doccolab-setup --help

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          uv export --locked --format cyclonedx1.5 --no-dev --no-emit-project \
            --output-file artifacts/doccolab.cdx.json

      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/
            artifacts/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/doccolab
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-artifacts/

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: release-artifacts/dist/
