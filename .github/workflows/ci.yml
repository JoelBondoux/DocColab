name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install uv==0.11.7 && uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check agent tests

      - name: Type-check
        run: uv run mypy agent

      - name: Test with branch coverage
        run: uv run pytest --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tools and project
        run: python -m pip install uv==0.11.7 && uv sync --locked --extra dev

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Run Bandit SAST
        run: uv run bandit -c pyproject.toml -r agent
